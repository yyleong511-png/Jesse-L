<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jesse L — Model / Talent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#f3efe4;
    --ink-2:#eae3d3;
    --paper:#2f2c26;
    --paper-dim:#6f6a5c;
    --crimson:#a8452c;
    --stone:#8c7b60;
    --line:rgba(47,44,38,0.14);
    --line-strong:rgba(47,44,38,0.26);
    --muted:#948d7c;
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  section[id]{scroll-margin-top:90px;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'Newsreader', serif;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    /* 短页面时最后一个区块撑满屏幕，手机上不会露出底部空白 */
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  body > section:last-of-type:not(.hero){flex:1 0 auto;}
  ::selection{background:var(--crimson);color:var(--ink);}

  a{color:inherit;text-decoration:none;}
  img{display:block;max-width:100%;}

  .mono{font-family:'JetBrains Mono', monospace; letter-spacing:0.03em;}
  .display{font-family:'Anton', sans-serif; text-transform:uppercase; font-weight:400;}

  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--stone);
    display:flex;
    align-items:center;
    gap:10px;
  }
  .eyebrow::before{
    content:"";
    width:22px;height:1px;background:var(--stone);
    display:inline-block;
  }

  /* ---------- NAV ---------- */
  header{
    position:fixed; top:0; left:0; right:0; z-index:100;
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 5vw;
    background:rgba(243,239,228,0.86);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .logo{
    font-family:'Anton', sans-serif;
    font-size:20px;
    letter-spacing:0.04em;
    color:var(--paper);
  }
  nav{display:flex; gap:34px;}
  nav a{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--paper);
    padding-bottom:3px;
    border-bottom:1px solid transparent;
    transition:border-color .3s var(--ease);
  }
  nav a:hover{border-color:var(--paper);}
  .nav-toggle{display:none;}

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    min-height:100vh;
    border-bottom:1px solid var(--line);
    background:#000;
    overflow:hidden;
  }
  .hero-text{
    position:absolute; inset:0;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    padding:0 5vw 100px;
    z-index:3;
  }
  .hero-frame-tag{
    position:absolute;
    top:100px; left:5vw;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.18em;
    color:rgba(244,242,236,0.7);
    opacity:0;
    z-index:3;
  }
  .hero h1{
    font-size:clamp(56px, 11vw, 148px);
    line-height:0.86;
    letter-spacing:-0.01em;
    color:var(--ink);
  }
  .hero h1 span{
    display:block;
    overflow:hidden;
  }
  .hero h1 span em{
    display:block;
    font-style:normal;
    transform:translateY(110%);
    transition:transform 1s var(--ease);
  }
  .hero .role{
    margin-top:22px;
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:rgba(244,242,236,0.75);
    opacity:0;
    transform:translateY(14px);
    transition:opacity .8s var(--ease) .6s, transform .8s var(--ease) .6s;
  }
  .hero .role b{color:var(--crimson); font-weight:600;}
  .hero.loaded .role{opacity:1; transform:none;}
  .hero.loaded .hero-frame-tag{opacity:1; transition:opacity 1s var(--ease) 1.1s;}
  .hero.loaded h1 span em{transform:translateY(0);}

  .hero-media{
    position:absolute; inset:0;
    overflow:hidden;
    background:#000;
  }
  .hero-media img{
    position:absolute; inset:0;
    width:100%; height:100%; object-fit:cover;
    object-position:center 20%;
    transform:scale(1.1);
    filter:grayscale(12%) contrast(1.03);
    opacity:0;
    transition:opacity 1.4s ease, transform 7s ease-out;
  }
  .hero-media img.is-active{opacity:1; transform:scale(1); z-index:1;}
  .hero-media::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(14,14,13,0) 40%, rgba(14,14,13,0.78) 100%);
    pointer-events:none;
    z-index:2;
  }
  .hero-caption{
    position:absolute; bottom:30px; right:30px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px; letter-spacing:0.08em; line-height:1.6;
    color:rgba(244,242,236,0.7);
    text-align:right;
    z-index:3;
  }

  .scroll-cue{
    position:absolute; bottom:34px; left:5vw;
    display:flex; align-items:center; gap:10px;
    font-family:'JetBrains Mono', monospace;
    font-size:10px; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--muted);
  }
  .scroll-cue .line{
    width:1px; height:34px; background:var(--line-strong);
    position:relative; overflow:hidden;
  }
  .scroll-cue .line::after{
    content:""; position:absolute; top:-100%; left:0; width:100%; height:100%;
    background:var(--crimson);
    animation:scrollpulse 2.2s ease-in-out infinite;
  }
  @keyframes scrollpulse{
    0%{top:-100%;} 60%{top:100%;} 100%{top:100%;}
  }

  /* ---------- SECTION shell ---------- */
  section{
    padding:150px 5vw;
    position:relative;
    border-bottom:1px solid var(--line);
  }
  .reveal{
    opacity:0; transform:translateY(28px);
    transition:opacity .9s var(--ease), transform .9s var(--ease);
  }
  .reveal.in{opacity:1; transform:none;}

  .section-head{
    display:flex; justify-content:space-between; align-items:flex-end;
    margin-bottom:64px; gap:40px; flex-wrap:wrap;
  }
  .section-head h2{
    font-family:'Anton', sans-serif;
    font-size:clamp(38px, 5vw, 64px);
    line-height:1;
    text-transform:uppercase;
    margin-top:14px;
  }
  .section-head p{
    max-width:340px;
    font-family:'JetBrains Mono', monospace;
    font-size:12px; line-height:1.7; color:var(--muted);
  }

  /* ---------- ABOUT ---------- */
  .about-grid{
    display:grid;
    grid-template-columns:0.85fr 1.15fr;
    gap:70px;
    align-items:start;
  }
  .about-portrait{
    position:relative;
    aspect-ratio:3/4;
    overflow:hidden;
    background:#000;
  }
  .about-portrait img{
    width:100%; height:100%; object-fit:cover;
    filter:grayscale(10%);
  }
  .about-portrait .corner{
    position:absolute; width:22px; height:22px;
    border:1px solid var(--paper); opacity:.7;
  }
  .about-portrait .tl{top:14px; left:14px; border-right:none; border-bottom:none;}
  .about-portrait .br{bottom:14px; right:14px; border-left:none; border-top:none;}

  .about-copy p{
    font-size:20px;
    line-height:1.65;
    color:var(--paper);
    font-weight:400;
    max-width:56ch;
  }
  .about-copy p + p{margin-top:22px;}
  .about-copy .drop{
    font-family:'Anton', sans-serif;
    font-size:60px;
    float:left;
    line-height:0.8;
    padding-right:10px;
    padding-top:6px;
    color:var(--crimson);
  }

  .stat-card{
    margin-top:52px;
    border-top:1px solid var(--line-strong);
  }
  .stat-row{
    display:flex; justify-content:space-between;
    padding:16px 0;
    border-bottom:1px solid var(--line);
    font-family:'JetBrains Mono', monospace;
  }
  .stat-row .k{font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--muted);}
  .stat-row .v{font-size:15px; color:var(--paper); font-weight:500;}
  .stat-card-label{
    font-family:'JetBrains Mono', monospace;
    font-size:11px; letter-spacing:0.16em; text-transform:uppercase;
    color:var(--stone); margin-bottom:2px;
  }

  /* ---------- PORTFOLIO SERIES ---------- */
  .series{margin-bottom:130px;}
  .series:last-child{margin-bottom:0;}
  .series-head{
    display:flex; align-items:baseline; gap:22px; margin-bottom:34px;
    flex-wrap:wrap;
  }
  .series-num{
    font-family:'JetBrains Mono', monospace;
    font-size:13px; color:var(--crimson); letter-spacing:0.1em;
  }
  .series-title{
    font-family:'Anton', sans-serif;
    font-size:clamp(26px,3.4vw,40px);
    text-transform:uppercase;
  }
  .series-desc{
    font-family:'JetBrains Mono', monospace;
    font-size:12px; color:var(--muted); max-width:420px; margin-left:auto;
    line-height:1.6;
  }

  .gallery{
    display:grid;
    gap:14px;
  }
  .g3{grid-template-columns:repeat(3,1fr);}
  .g4{grid-template-columns:repeat(4,1fr);}
  .g2{grid-template-columns:repeat(2,1fr);}

  .frame{
    position:relative;
    overflow:hidden;
    background:#000;
    cursor:pointer;
  }
  .frame img{
    width:100%; height:100%; object-fit:cover;
    transition:transform 1s var(--ease), filter .6s ease;
    filter:saturate(0.94);
  }
  .frame:hover img{transform:scale(1.045); filter:saturate(1.05);}
  .frame .fnum{
    position:absolute; bottom:12px; left:12px;
    font-family:'JetBrains Mono', monospace;
    font-size:10px; letter-spacing:0.1em; color:var(--paper);
    opacity:0; transform:translateY(6px);
    transition:opacity .35s ease, transform .35s ease;
    background:rgba(14,14,13,0.55);
    padding:4px 8px;
  }
  .frame:hover .fnum{opacity:1; transform:none;}
  .frame .corner-mark{
    position:absolute; inset:10px; pointer-events:none;
    opacity:0; transition:opacity .35s ease;
  }
  .frame:hover .corner-mark{opacity:1;}
  .corner-mark span{position:absolute; width:14px; height:14px; border:1px solid rgba(244,242,236,0.85);}
  .corner-mark .c1{top:0;left:0;border-right:none;border-bottom:none;}
  .corner-mark .c2{top:0;right:0;border-left:none;border-bottom:none;}
  .corner-mark .c3{bottom:0;left:0;border-right:none;border-top:none;}
  .corner-mark .c4{bottom:0;right:0;border-left:none;border-top:none;}

  .tall{grid-row:span 2;}

  /* ---------- BEYOND ---------- */
  .beyond-list{border-top:1px solid var(--line-strong);}

  .credit-strip{margin-top:44px; border-top:1px solid var(--line-strong); padding-top:44px;}
  .credit-strip:first-of-type{margin-top:20px;}
  .credit-grid{display:grid; grid-template-columns:360px 1fr; gap:52px; align-items:center;}
  .credit-grid .frame{aspect-ratio:1/1;}
  .credit-grid .series-title{font-size:30px; line-height:1.1;}
  .credit-grid p{font-size:12.5px; color:var(--muted); margin-top:14px; max-width:52ch; line-height:1.75;}
  .beyond-item{
    display:grid;
    grid-template-columns:70px 1fr 1.4fr;
    gap:30px;
    padding:30px 0;
    border-bottom:1px solid var(--line);
    align-items:baseline;
    transition:background .3s ease;
  }
  .beyond-item:hover{background:rgba(244,242,236,0.03);}
  .beyond-item .idx{font-family:'JetBrains Mono', monospace; color:var(--crimson); font-size:13px;}
  .beyond-item h3{
    font-family:'Anton', sans-serif; font-size:22px; text-transform:uppercase;
    letter-spacing:0.01em;
  }
  .beyond-item p{
    font-family:'JetBrains Mono', monospace; font-size:12.5px; line-height:1.7; color:var(--muted);
    max-width:52ch;
  }
  .beyond-link{
    display:inline-block; margin-top:10px;
    font-family:'JetBrains Mono', monospace; font-size:11.5px; letter-spacing:0.04em;
    color:var(--crimson); border-bottom:1px solid transparent;
  }
  .beyond-item.has-bg{
    position:relative;
    padding:30px 24px;
    overflow:hidden;
  }
  .beyond-item.has-bg::before{
    content:"";
    position:absolute; inset:0;
    background-image:var(--bg-img);
    background-size:cover;
    background-position:center 20%;
    opacity:0.9;
    z-index:0;
  }
  .beyond-item.has-bg::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(90deg, rgba(243,239,228,0.97) 0%, rgba(243,239,228,0.86) 38%, rgba(243,239,228,0.4) 72%, rgba(243,239,228,0.16) 100%);
    z-index:0;
  }
  .beyond-item.has-bg.flat-fade::before{opacity:0.3;}
  .beyond-item.has-bg.flat-fade::after{background:rgba(243,239,228,0.4);}
  .beyond-item.has-bg > *{position:relative; z-index:1;}
  .beyond-item.has-bg h3,
  .beyond-item.has-bg .idx,
  .beyond-item.has-bg .beyond-desc p{
    text-shadow:0 1px 4px rgba(243,239,228,0.9), 0 0 10px rgba(243,239,228,0.6);
    color:var(--paper);
  }
  .bg-credit{
    position:absolute; bottom:12px; right:16px;
    font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.06em;
    color:var(--paper-dim);
    text-shadow:0 1px 4px rgba(0,0,0,0.7);
    z-index:1;
  }
  .beyond-link:hover{border-color:var(--crimson);}
  .beyond-link + .beyond-link{margin-left:16px;}

  /* ---------- CONTACT ---------- */
  .contact{
    background:var(--paper);
    color:var(--ink);
    border-bottom:none;
  }
  .contact .eyebrow{color:var(--crimson);}
  .contact .eyebrow::before{background:var(--crimson);}
  .contact h2{
    font-family:'Anton', sans-serif;
    font-size:clamp(46px, 8vw, 108px);
    line-height:0.92;
    text-transform:uppercase;
    margin:20px 0 60px;
    max-width:14ch;
  }
  .contact-links{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:1px;
    background:rgba(14,14,13,0.14);
    border-top:1px solid rgba(14,14,13,0.14);
  }
  .contact-link{
    background:var(--paper);
    padding:34px 6px 34px 0;
    display:flex; flex-direction:column; gap:10px;
    transition:background .3s ease, padding-left .3s ease;
  }
  .contact-link:hover{background:rgba(196,18,48,0.06); padding-left:14px;}
  .contact-link .k{
    font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.16em;
    text-transform:uppercase; color:var(--crimson);
  }
  .contact-link .v{
    font-family:'Newsreader', serif; font-size:19px; font-style:italic;
    word-break:break-word;
  }

  footer{
    padding:26px 5vw;
    display:flex; justify-content:space-between; align-items:center;
    background:var(--paper); color:var(--ink);
    font-family:'JetBrains Mono', monospace; font-size:10.5px;
    letter-spacing:0.08em; color:#6b6963;
    flex-wrap:wrap; gap:10px;
  }

  /* ---------- FLIPBOOK (翻书式作品浏览) ---------- */
  .flipbook-wrap{position:relative;}
  .flipbook{
    display:flex;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    scroll-behavior:smooth;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    -ms-overflow-style:none;
    padding:2px 0 4px;
  }
  .flipbook::-webkit-scrollbar{display:none;}
  .flipbook > .frame{
    flex:0 0 auto;
    aspect-ratio:3/4 !important;
    height:min(64vh,680px);
    width:auto;
    margin-right:20px;
    scroll-snap-align:start;
    box-shadow:-16px 0 30px -20px rgba(47,44,38,0.55);
  }
  .flipbook > .frame:last-child{margin-right:0;}
  .flipbook > .frame .fnum{opacity:1; transform:none; color:var(--ink); background:rgba(14,14,13,0.55);}
  .flipbook > .frame .corner-mark{opacity:0.5;}
  .flip-bar{display:flex; align-items:center; gap:12px; margin-top:16px;}
  .flip-btn{
    width:40px; height:40px;
    border:1px solid var(--line-strong);
    background:transparent;
    color:var(--paper);
    font-family:'JetBrains Mono', monospace;
    font-size:13px; line-height:1;
    cursor:pointer;
    transition:background .3s var(--ease), color .3s var(--ease), border-color .3s var(--ease), opacity .3s ease;
  }
  .flip-btn:hover:not(:disabled){background:var(--paper); color:var(--ink); border-color:var(--paper);}
  .flip-btn:disabled{opacity:0.25; cursor:default;}
  .flip-count{font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.16em; color:var(--muted);}
  .flip-hint{
    margin-left:auto;
    font-family:'JetBrains Mono', monospace;
    font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color:var(--stone);
  }

  @media (max-width:860px){
    .flipbook > .frame{height:auto; width:min(520px,74vw); margin-right:14px;}
  }

  /* ---------- 首页：桌面端 16:9 幻灯片 ---------- */
  @media (min-width:861px){
    body.home .hero{min-height:0; height:auto; aspect-ratio:16/9;}
    body.home .hero-text{padding-bottom:64px;}
    body.home footer{margin-top:auto;}
  }

  /* ---------- RESPONSIVE ---------- */
  /* 断点策略
     ≥1440px  桌面宽屏横向
     ≤1200px  笔电
     ≤1024px  平板横向
     ≤860px   平板竖屏
     ≤640px   手机竖屏（主要目标）
     ≤400px   小屏手机
     横屏矮视口 / 触屏设备 单独处理
  */

  /* 视口单位兜底：手机浏览器地址栏收放时不跳动 */
  @supports (height:100svh){
    .hero{min-height:100svh;}
  }

  /* ===== 桌面宽屏横向 ===== */
  @media (min-width:1440px){
    header{padding:22px 5vw;}
    section{padding:170px 5vw;}
    .hero-text{padding:0 5vw 120px;}
    .about-grid{gap:90px;}
    .gallery{gap:18px;}
    .beyond-item{grid-template-columns:90px 1fr 1.5fr; gap:40px;}
    .credit-grid{grid-template-columns:400px 1fr; gap:64px;}
    .stat-row .v{font-size:16px;}
  }

  /* ===== 笔电 ===== */
  @media (max-width:1200px){
    section{padding:130px 5vw;}
    .credit-grid{grid-template-columns:300px 1fr; gap:40px;}
    .beyond-item{grid-template-columns:60px 1fr 1.15fr; gap:26px;}
    .about-grid{gap:52px;}
  }

  /* ===== 平板横向 ===== */
  @media (max-width:1024px){
    section{padding:112px 5.5vw;}
    nav{gap:24px;}
    .about-grid{grid-template-columns:1fr 1.1fr; gap:44px;}
    .about-copy p{font-size:18px;}
    .about-copy .drop{font-size:52px;}
    .g4{grid-template-columns:repeat(3,1fr);}
    .section-head{margin-bottom:48px;}
    .series{margin-bottom:100px;}
    .contact h2{margin:18px 0 44px;}
  }

  /* ===== 平板竖屏 ===== */
  @media (max-width:860px){
    header{padding:18px 6vw;}
    .logo{font-size:16px;}
    nav{gap:16px;}
    nav a{font-size:9.5px;}
    .hero-frame-tag{display:none;}
    .scroll-cue{display:none;}
    section{padding:90px 6vw;}
    .about-grid{grid-template-columns:1fr; gap:44px;}
    .about-portrait{max-width:460px;}
    .g3,.g4{grid-template-columns:repeat(2,1fr);}
    .tall{grid-row:auto;}
    .series-desc{margin-left:0;}
    .credit-grid{grid-template-columns:1fr; gap:26px;}
    .credit-grid .frame{max-width:340px;}
    .beyond-item{grid-template-columns:40px 1fr;}
    .beyond-item .beyond-desc{grid-column:2/3; margin-top:2px;}
    .contact-links{grid-template-columns:1fr;}
    .contact-link:hover{padding-left:0;}
  }

  /* ===== 手机竖屏 ===== */
  @media (max-width:640px){
    /* 导航：Logo 一行，菜单一行，永远不会挤 */
    header{
      flex-direction:column;
      align-items:center;
      gap:10px;
      padding:calc(12px + env(safe-area-inset-top)) 6vw 12px;
    }
    .logo{font-size:15px; letter-spacing:0.08em;}
    nav{
      gap:0;
      width:100%;
      justify-content:space-between;
      max-width:none;
    }
    nav a{font-size:9px; letter-spacing:0.05em; padding-bottom:2px; white-space:nowrap;}
    .flipbook > .frame{height:auto; width:min(520px,80vw); margin-right:12px;}
    .flip-hint{display:none;}
    .flip-btn{width:36px; height:36px;}
    section[id]{scroll-margin-top:104px;}

    /* 主视觉 */
    .hero{min-height:88vh;}
    .hero-text{
      padding:0 6vw calc(64px + env(safe-area-inset-bottom));
      justify-content:flex-end;
    }
    .hero h1{font-size:clamp(48px,17vw,86px); line-height:0.9;}
    .hero .role{margin-top:16px; font-size:11px; letter-spacing:0.1em; line-height:1.6;}
    .hero-media img{object-position:center 22%;}
    .hero-caption{
      bottom:auto; top:calc(88px + env(safe-area-inset-top));
      right:6vw; left:6vw;
      text-align:right; font-size:9.5px; line-height:1.5;
      max-width:none;
    }

    /* 区块与标题 */
    section{padding:68px 6vw;}
    /* 非首页主视觉的页面：首个区块要避开固定导航 */
    body > section:first-of-type:not(.hero){padding-top:118px;}
    .section-head{margin-bottom:34px; gap:18px;}
    .section-head h2{font-size:clamp(30px,9vw,44px); margin-top:10px;}
    .section-head p{max-width:none; font-size:11.5px; line-height:1.75;}
    .eyebrow{font-size:10px; letter-spacing:0.18em;}
    .eyebrow::before{width:16px;}

    /* 关于 */
    .about-grid{gap:32px;}
    .about-portrait{max-width:100%;}
    .about-copy p{font-size:16.5px; line-height:1.72; max-width:none;}
    .about-copy p + p{margin-top:18px;}
    .about-copy .drop{font-size:44px; padding-right:8px; padding-top:4px;}

    /* 数据表 */
    .stat-card{margin-top:36px;}
    .stat-row{padding:13px 0; gap:14px; align-items:baseline;}
    .stat-row .k{font-size:10px; letter-spacing:0.12em; flex:0 0 auto;}
    .stat-row .v{font-size:13.5px; text-align:right;}

    /* 作品集 */
    .series{margin-bottom:64px;}
    .series-head{gap:10px; margin-bottom:20px; align-items:baseline;}
    .series-num{font-size:11px;}
    .series-title{font-size:clamp(22px,6.4vw,30px);}
    .series-desc{font-size:11.5px; max-width:none; width:100%; line-height:1.7;}
    .gallery{gap:10px;}
    .g2{grid-template-columns:1fr;}
    .g3,.g4{grid-template-columns:repeat(2,1fr);}
    .frame .corner-mark{inset:7px;}
    .corner-mark span{width:10px; height:10px;}
    .frame .fnum{font-size:9px; bottom:8px; left:8px; padding:3px 6px;}

    /* 幕后 / 更多 */
    .credit-strip{margin-top:34px; padding-top:34px;}
    .credit-grid{gap:20px;}
    .credit-grid .frame{max-width:100%;}
    .credit-grid .series-title{font-size:24px;}
    .credit-grid p{font-size:12px; max-width:none;}

    .beyond-item{
      grid-template-columns:1fr;
      gap:8px;
      padding:26px 0;
    }
    .beyond-item .idx{font-size:11px;}
    .beyond-item h3{font-size:19px; line-height:1.25;}
    .beyond-item p{font-size:12px; max-width:none; line-height:1.75;}
    .beyond-item .beyond-desc{grid-column:auto; margin-top:6px;}
    .beyond-item.has-bg{padding:26px 18px;}
    /* 竖屏时文字整块盖在图上，横向渐变换成整体压暗，保证可读 */
    .beyond-item.has-bg::before{background-position:center 28%; opacity:0.85;}
    .beyond-item.has-bg::after{
      background:linear-gradient(180deg,
        rgba(243,239,228,0.95) 0%,
        rgba(243,239,228,0.9) 55%,
        rgba(243,239,228,0.62) 100%);
    }
    .beyond-item.has-bg.flat-fade::after{background:rgba(243,239,228,0.86);}
    .bg-credit{font-size:9px; bottom:8px; right:10px;}
    .beyond-link{font-size:11px; margin-top:12px;}
    .beyond-link + .beyond-link{margin-left:0; margin-top:8px; display:block;}

    /* 联系 */
    .contact h2{font-size:clamp(34px,11vw,56px); margin:16px 0 34px; max-width:none;}
    .contact-link{padding:24px 0;}
    .contact-link .k{font-size:10px;}
    .contact-link .v{font-size:16.5px;}

    footer{
      padding:22px 6vw calc(22px + env(safe-area-inset-bottom));
      flex-direction:column;
      align-items:flex-start;
      gap:6px;
      font-size:10px;
    }
  }

  /* ===== 小屏手机 ===== */
  @media (max-width:400px){
    nav{max-width:none;}
    nav a{font-size:8px; letter-spacing:0.03em;}
    section{padding:58px 6.5vw;}
    .hero h1{font-size:clamp(42px,16vw,68px);}
    .gallery{gap:8px;}
    .stat-row .k{font-size:9.5px;}
    .stat-row .v{font-size:12.5px;}
    .about-copy p{font-size:16px;}
  }

  /* ===== 手机横放（矮视口） ===== */
  @media (orientation:landscape) and (max-height:520px){
    header{flex-direction:row; padding:12px 5vw; gap:0;}
    nav{width:auto; max-width:none; gap:18px; justify-content:flex-end;}
    section[id]{scroll-margin-top:70px;}
    .hero{min-height:100vh;}
    .hero-text{padding:0 5vw 44px;}
    .hero h1{font-size:clamp(40px,9vw,72px);}
    .hero-caption{position:absolute; top:auto; bottom:18px; left:auto; right:5vw;}
    section{padding:56px 5vw;}
    body > section:first-of-type:not(.hero){padding-top:88px;}
    .g3,.g4{grid-template-columns:repeat(3,1fr);}
  }

  /* ===== 触屏：去掉只在悬停下才可见的信息 ===== */
  @media (hover:none){
    .frame{cursor:default;}
    .frame:hover img{transform:none; filter:saturate(0.94);}
    .frame .fnum{opacity:0.75; transform:none;}
    .frame .corner-mark{opacity:0.5;}
    .beyond-item:hover{background:none;}
    .contact-link:hover{background:var(--paper); padding-left:0;}
    nav a:hover{border-color:transparent;}
    .beyond-link{border-bottom-color:var(--crimson);}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important; animation:none !important;}
  }
nav a.active{border-color:var(--paper);}
  .series-compact{margin-bottom:56px;}
  .series-compact .series-head{margin-bottom:26px;}
</style>
</head>

      i = (i + 1) % slides.length;
      slides[i].classList.add('is-active');
    }, 4200);
  })();
</script>
